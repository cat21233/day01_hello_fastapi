# ============================================================
# CI 工作流：每次 push / PR 到 main、dev 时自动跑测试
#
# 设计原则：
#   1. 不依赖 Docker —— 用 actions/setup-python 直接装依赖跑 pytest，
#      容器化是后续加的 job，不是前提。
#   2. 本项目的测试全部 mock，零真实 API 调用 → 不需要真实密钥。
#      但代码在 import 期就会读配置（llm_service/factory.py 按 api_key
#      是否为空来过滤可用厂商），配置为空会直接抛 ValueError，
#      导致测试文件在【收集期】就 ERROR。故此处塞入哑值（dummy），
#      让「有哪些厂商可用」这个判断能通过。
#      ⚠️ 哑值不是秘密，放 Secrets 反而是概念污染。
#      ⚠️ 这是止血方案；治本方案是让 LLMClient 惰性初始化（见项目欠账）。
#   3. 用 pytest 的默认收集范围（由 pyproject.toml 的 testpaths 约束），
#      不写 `pytest tests/`，让本地与 CI 行为严格一致。
# ============================================================

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest

    # 哑环境变量：只为让 import 期不炸，测试不会真发请求。
    # LLM_PROVIDER 不用给 —— config.py 里默认值就是 "deepseek"。
    # 值必须是【非空字符串】：空字符串会被 factory.py 的过滤规则剔除。
    env:
      DEEPSEEK_API_KEY: dummy-key-for-ci
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-chat

    steps:
      # --- 1. 取代码 ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- 2. 装 Python ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"        # 与本地 .venv 的 3.12 对齐

      # --- 3. 装依赖 ---
      # 顺序有讲究：先生产依赖（被测对象），再开发依赖（测试工具）
      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # --- 4. 跑测试 + 覆盖率 ---
      # 这里写裸 `pytest`：收集范围由 pyproject.toml 的 testpaths 决定。
      # 若本地与 CI 有任何不一致，这一步会立刻暴露。
      #
      # 注意：本地（Windows）覆盖率的路径分隔符是 `\`，Linux runner 上是 `/`。
      #      目前只打印到终端，无影响；若以后接入 Codecov 等做跨平台对比，
      #      需加 `--cov-report=xml` 并在服务端做路径规范化。
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing

      # --- 5. 覆盖率报告归档（无论成败都上传，失败时才有东西可查） ---
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore
